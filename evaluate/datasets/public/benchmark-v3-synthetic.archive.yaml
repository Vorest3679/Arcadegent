    route_origin: [116.4610, 39.9080]
    route_destination: [116.4610, 39.9080]
    required_tools: [route_plan_tool]
    forbid_route: false

- id: missing-location-clarification
  group: robustness
  description: “这里附近”没有定位和城市时，先澄清，不得把默认城市或旧数据当位置。
  capabilities: [missing-context, clarification, no-hallucinated-search]
  turns:
  - message: 这里附近哪里能打舞萌？
    forbidden_tools: [db_query_tool, route_plan_tool, geo_resolve_tool, invoke_worker]
    answer_contains: [位置]

- id: price-hours-evidence-boundary
  group: robustness
  description: 数据没有营业时间或价格时，模型需承认未知，不能编造。
  capabilities: [unsupported-fact, evidence-discipline]
  turns:
  - message: 杭州东站印象汇那家几点关门，舞萌多少钱一局？数据没有就直接说不知道。
    required_shop_ids: [910001, 910002]
    required_tools: [db_query_tool]
    answer_not_contains: [24小时]

