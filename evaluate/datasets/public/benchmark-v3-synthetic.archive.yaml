  description: 用户明确目的地和当前定位时，不应错误沿用其他城市历史候选。
  capabilities: [direct-navigation, explicit-location, city-isolation]
  turns:
  - message: 我在北京国贸商城，导航到商城里的乐游，开车去。
    location: {lng: 116.4610, lat: 39.9080, city: 北京市, accuracy_m: 30}
