- id: oral-navigation-after-selection
  group: navigation
  description: 先口语检索，再用“第一家”触发步行导航；只在 EVAL_MAP_MODE=live 时运行。
  capabilities: [multi-turn-selection, walking-route, artifact-freshness]
  turns:
  - message: 我在杭州东站，附近印象汇里面有没有机厅？按近到远给我看。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 25}
    required_shop_ids: [910001, 910002]
    forbidden_shop_ids: [910003]
    required_tools: [db_query_tool]
  - message: 就去第一家，帮我走路过去。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 25}
    route_mode: walking
    route_origin: [120.2150, 30.2890]
    route_destination: [120.2143, 30.2895]
    required_tools: [route_plan_tool]
    forbid_route: false

- id: oral-navigation-mode-switch
  group: navigation
  description: 同一目的地由“步行”改“开车”，路线 artifact 必须是当前轮的 driving 结果。
  capabilities: [multi-turn, route-mode-switch, stale-route-prevention]
  turns:
  - message: 从杭州东站去印象汇店，先给我步行路线。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 25}
    route_mode: walking
    route_origin: [120.2150, 30.2890]
    route_destination: [120.2143, 30.2895]
    required_tools: [route_plan_tool]
    forbid_route: false
  - message: 临时要开车了，还是去刚才那家，换成驾车路线。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 25}
    route_mode: driving
    route_origin: [120.2150, 30.2890]
    route_destination: [120.2143, 30.2895]
    required_tools: [route_plan_tool]
    forbid_route: false

