  capabilities: [nearby-search, title-alias, station-context]
  turns:
  - message: 我现在在天水南站，最近能打舞萌的是哪？只要最近的一家就好。
    location: {lng: 105.8680, lat: 34.5530, city: 天水市, accuracy_m: 45}
    required_shop_ids: [920003]
    ordered_prefix: [920003]
    required_tools: [db_query_tool]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {title_name: maimai, sort_by: distance, sort_order: asc}

- id: tianshui-wanda-chunithm-ambiguity
  group: retrieval
  description: 同一城市有两个“万达”，用户要求同时覆盖秦州和麦积。
  capabilities: [ambiguous-landmark, candidate-coverage, title-filter]
  turns:
  - message: 天水万达能打中二吗？我还没想好去秦州还是麦积，两个地方都帮我看看。
    shop_ids: [920002, 920003]
    required_tools: [db_query_tool]
    answer_contains: [秦州, 麦积]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {city_name: 天水市, title_name: CHUNITHM}

- id: no-arcade-record-is-not-an-arcade
  group: retrieval
  description: 名字像娱乐场所但数据中无机种记录，必须返回空而不是以名称猜测。
  capabilities: [negative-result, evidence-discipline]
  turns:
  - message: 天水欢乐天地里面有舞萌吗？没有记录就告诉我没有，别猜它大概会有。
    shop_ids: []
    required_tools: [db_query_tool]
    answer_not_contains: [肯定]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {shop_name: 天水欢乐天地, title_name: maimai}

- id: cross-city-context-reset
