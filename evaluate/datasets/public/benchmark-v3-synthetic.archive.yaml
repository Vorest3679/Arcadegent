# 合成开发集 v3：26 retrieval / 4 navigation / 2 robustness。
# 文本模仿真实用户口语；商户、地址、坐标均为合成数据，不能用于实际推荐。
# 这是开发集：允许迭代 prompt、工具和 rubric；正式排名应另建人工审核的私有 holdout。

- id: hangzhou-east-impressions-hub
  group: retrieval
  description: 用户只说商场名，定位用于消除杭州两个“印象汇”的歧义。
  capabilities: [named-place, client-location, nearby-ranking, entity-disambiguation]
  turns:
  - message: 我在杭州东站出来，想看看印象汇里面有没有机厅能玩；说的是我这里附近这家，别把西湖那家也算进来。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 35}
    required_shop_ids: [910001, 910002]
    forbidden_shop_ids: [910003]
    required_tools: [db_query_tool]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {sort_by: distance, sort_order: asc, origin_lng: 120.215, origin_lat: 30.289}

- id: here-nearby-maimai
  group: retrieval
  description: “这里附近”“舞萌”需要映射到浏览器定位、距离排序和 title filter。
  capabilities: [colloquial-title-alias, deictic-location, distance-sort]
  turns:
  - message: 这里附近舞萌在哪？我刚下南京南站，按近到远给我看。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 25}
    required_shop_ids: [910001, 910002, 910005, 910006]
    forbidden_shop_ids: [910003]
    ordered_prefix: [910002]
    required_tools: [db_query_tool]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {title_name: maimai, sort_by: distance, sort_order: asc}

- id: hangzhou-east-chunithm
  group: retrieval
  description: 将“中二”理解为 CHUNITHM，并使用定位筛掉异地门店。
  capabilities: [title-alias, nearby-ranking, distractor-rejection]
  turns:
  - message: 东站附近想打中二，最好别走太远；有的店列出来就行，不要把只有舞萌的店混进来。
    location: {lng: 120.2150, lat: 30.2890, city: 杭州市, accuracy_m: 25}
    required_shop_ids: [910001, 910002, 910005, 910007]
    forbidden_shop_ids: [910003, 910006]
