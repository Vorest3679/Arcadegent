    required_tools: [db_query_tool]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {has_arcades: true, sort_by: distance}

- id: tianshui-casual-arcades
  group: retrieval
  description: “天水有没有机厅玩的”必须离散为天水市内有机种记录的门店，而不是查省级或相邻城市。
  capabilities: [colloquial-city-query, city-boundary, broad-search]
  turns:
  - message: 天水有没有机厅玩的？今天就想随便打点音游，没有也直说，别把陇南的给我算进来。
    shop_ids: [920001, 920002, 920003]
    required_tools: [db_query_tool]
    tool_argument_assertions:
    - tool: db_query_tool
      stage: prepared
      contains: {city_name: 天水市, has_arcades: true}

- id: tianshui-south-station-maimai
