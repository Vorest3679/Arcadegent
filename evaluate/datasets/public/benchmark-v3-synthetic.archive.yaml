- id: east-station-not-a-mall
  group: retrieval
  description: 地标附近有无机种地点，不能把“候车区娱乐中心”当机厅。
  capabilities: [nearby-search, has-arcades-filter, negative-distractor]
  turns:
  - message: 杭州东站旁边有没有正经机厅？候车区那种没有音游机器的就别推荐给我。
    location: {lng: 120.2170, lat: 30.2880, city: 杭州市, accuracy_m: 30}
